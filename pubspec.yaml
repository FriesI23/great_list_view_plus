name: great_list_view_plus
description: Animated and reorderable Flutter lists with automatic diff updates and a tree adapter. Maintained fork of great_list_view.
version: 0.3.1
homepage: https://github.com/FriesI23/great_list_view_plus
repository: https://github.com/FriesI23/great_list_view_plus
issue_tracker: https://github.com/FriesI23/great_list_view_plus/issues

topics:
  - list-view
  - animations
  - reorderable
  - tree-view

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  diffutil_dart: ^5.0.0
  material_ui: ^1.11.1
  worker_manager: ^7.2.9

dev_dependencies:
  cupertino_ui: ^1.1.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
